
<!DOCTYPE html><html lang="th"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Budget Pro 8 Premium</title>
<link rel="manifest" href="manifest.json">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{font-family:-apple-system,sans-serif;background:#F4F7FB;margin:0;padding-bottom:90px}
header{background:linear-gradient(135deg,#0F766E,#2563EB);color:#fff;padding:20px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px}
.card{padding:16px;border-radius:18px;font-weight:700}
.g{background:#DCFCE7}.b{background:#DBEAFE}.y{background:#FEF3C7}.p{background:#FCE7F3}
.box{background:#fff;margin:12px;border-radius:18px;padding:14px}
button{background:#2563EB;color:#fff;border:none;border-radius:12px;padding:12px}
input,select{width:100%;padding:10px;margin:6px 0;border-radius:10px;border:1px solid #ddd}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:10px}
#modal{display:none;position:fixed;inset:0;background:#0007;align-items:center;justify-content:center}
.modal{background:#fff;width:92%;max-width:380px;border-radius:18px;padding:16px}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}
</style></head><body>
<header><h2>Budget Pro 8 Premium</h2></header>
<div class="cards">
<div class="card g">งบรวม<div id=t></div></div>
<div class="card b">ใช้ไป<div id=s></div></div>
<div class="card y">คงเหลือ<div id=r></div></div>
<div class="card p">ความคืบหน้า<div id=pc></div></div></div>
<div class="box"><button onclick="openAdd()">➕ เพิ่มรายการ</button></div>
<div class="box"><h3>กราฟค่าใช้จ่าย</h3><canvas id=pie height=220></canvas></div>
<div class="box"><h3>รายจ่ายรายเดือน</h3><canvas id=bar height=220></canvas></div>
<div class="box"><h3>รายการทั้งหมด</h3><input id=search placeholder="ค้นหา..." oninput="render()"><div id=list></div></div>
<div id=modal><div class=modal>
<h3>เพิ่มรายการ</h3>
<input id=name placeholder="ชื่อรายการ">
<select id=cat>
<option>ที่ดิน</option><option>ถมที่</option><option>เคลียริ่ง</option><option>โครงสร้าง</option><option>เขื่อน</option><option>ถนน</option><option>ไฟฟ้า</option><option>เครื่องใช้ไฟฟ้า</option><option>อุปกรณ์ตกแต่ง</option><option>รั้วบ้าน</option><option>จัดสวน</option>
</select>
<input id=amt type=number placeholder="จำนวนเงิน">
<button onclick="add()">บันทึก</button>
</div></div>
<nav><div>🏠</div><div>💰</div><div>💸</div><div>👷</div><div>📄</div><div>⚙️</div></nav>
<script>
let db=JSON.parse(localStorage.bp8||'{"budget":5800000,"items":[]}');
let pieChart,barChart;
function openAdd(){modal.style.display='flex'}
function add(){db.items.push({name:name.value,cat:cat.value,amt:+amt.value||0,date:new Date().toISOString()});localStorage.bp8=JSON.stringify(db);modal.style.display='none';name.value='';amt.value='';render();}
function del(i){db.items.splice(i,1);localStorage.bp8=JSON.stringify(db);render();}
function render(){
let spent=db.items.reduce((a,b)=>a+b.amt,0);
t.textContent=db.budget.toLocaleString();s.textContent=spent.toLocaleString();
r.textContent=(db.budget-spent).toLocaleString();pc.textContent=Math.round(spent/db.budget*100)+'%';
let q=search.value.toLowerCase();
list.innerHTML=db.items.map((x,i)=>({x,i})).filter(o=>o.x.name.toLowerCase().includes(q)||o.x.cat.toLowerCase().includes(q)).map(o=>`<div class=row><div><b>${o.x.name}</b><br><small>${o.x.cat}</small></div><div>${o.x.amt.toLocaleString()}<br><button onclick='del(${o.i})'>ลบ</button></div></div>`).join('');
let c={};db.items.forEach(i=>c[i.cat]=(c[i.cat]||0)+i.amt);
if(pieChart)pieChart.destroy();
pieChart=new Chart(pie,{type:'pie',data:{labels:Object.keys(c),datasets:[{data:Object.values(c)}]}});
let m=new Array(12).fill(0);db.items.forEach(i=>m[new Date(i.date).getMonth()]+=i.amt);
if(barChart)barChart.destroy();
barChart=new Chart(bar,{type:'bar',data:{labels:['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'],datasets:[{label:'รายเดือน',data:m}]},options:{plugins:{legend:{display:false}}}});
}
render();
</script></body></html>
