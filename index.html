
<!doctype html><html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Budget Pro X v5.0</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script></head>
<body>
<header><h2>🏡 Budget Pro X v5.0</h2><small>Offline + Local Save</small></header>
<main>
<section id=home class="page active">
<div class=cards>
<div class="card g"><span>งบรวม</span><b id=total>0</b></div>
<div class="card b"><span>ใช้ไป</span><b id=spent>0</b></div>
<div class="card y"><span>คงเหลือ</span><b id=remain>0</b></div>
<div class="card p"><span>ความคืบหน้า</span><b id=pct>0%</b></div></div>
<button id=open>➕ เพิ่มรายการ</button>
<div class=panel><canvas id=pie height=180></canvas></div>
</section>
<section id=budget class=page><div class=panel><h3>Master Budget</h3><div id=budgetList></div><input id=newCat placeholder="เพิ่มหมวดเอง"><button id=addCat>เพิ่มหมวด</button></div></section>
<section id=expense class=page><div class=panel><input id=search placeholder="ค้นหา"><div id=list></div></div></section>
<section id=contractor class=page><div class=panel><input id=cn placeholder="ชื่อผู้รับเหมา"><input id=cp placeholder="เบอร์"><button id=saveCon>บันทึก</button><div id=cons></div></div></section>
<section id=payment class=page><div class=panel><input id=due type=date><button id=saveDue>เพิ่มงวด</button><div id=dues></div></div></section>
<section id=settings class=page><div class=panel><input id=budgetInput type=number><button id=saveBudget>บันทึกงบ</button><button id=backup>Backup JSON</button><input id=restoreFile type=file accept=.json></div></section>
</main>
<div id=modal class=hide><div class=sheet><h3>เพิ่ม/แก้ไขรายจ่าย</h3><input id=name placeholder="ชื่อรายการ"><select id=cat></select><input id=amt type=number placeholder="จำนวนเงิน"><button id=saveExpense>บันทึก</button><button id=close>ยกเลิก</button></div></div>
<nav id=nav>
<button data-page=home>🏠</button><button data-page=budget>💰</button><button data-page=expense>💸</button><button data-page=contractor>👷</button><button data-page=payment>📄</button><button data-page=settings>⚙️</button>
</nav>
<script src="app.js"></script><script src="db.js"></script></body></html>
