<!doctype html><html lang='th'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Budget Pro X v5.2</title><link rel='manifest' href='manifest.json'><style>
body{font-family:-apple-system;margin:0;background:#eef1f5;padding-bottom:80px}
header{background:linear-gradient(135deg,#0f766e,#2563eb);color:#fff;padding:22px}
.page{display:none;padding:16px}.page.active{display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card,.panel{background:#fff;border-radius:18px;padding:16px}
button,input,select{width:100%;padding:14px;margin-top:10px;border-radius:12px;border:1px solid #ddd;box-sizing:border-box}
button{background:#2563eb;color:#fff;border:none;font-weight:bold}
nav{position:fixed;bottom:0;left:0;right:0;height:72px;background:#fff;border-top:1px solid #ddd;display:flex}
nav button{flex:1;background:#fff;color:#666;font-size:11px;border:none;margin:0;padding:4px}
nav button.active{color:#2563eb}
#modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center}
#modal.show{display:flex}.sheet{background:#fff;border-radius:20px;padding:18px;width:92%;max-width:380px}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}
canvas{width:100%;height:220px}
</style></head><body>
<header><h2>🏡 Budget Pro X v5.2</h2><p>Safari Fix</p></header>

<div id=home class="page active"><div class=grid><div class=card><div>งบรวม</div><h2 id=total></h2></div><div class=card><div>ใช้ไป</div><h2 id=spent></h2></div><div class=card><div>คงเหลือ</div><h2 id=remain></h2></div><div class=card><div>ความคืบหน้า</div><h2 id=percent></h2></div></div><div class=panel><button id=openBtn>➕ เพิ่มรายการ</button><canvas id=pie width=320 height=220></canvas></div></div>
<div id=budget class=page><div class=panel><h3>หมวดงบ</h3><div id=catList></div><input id=newCat placeholder='เพิ่มหมวด'><button id=addCat>เพิ่มหมวด</button></div></div>
<div id=expense class=page><div class=panel><h3>รายการ</h3><div id=itemList></div></div></div>
<div id=contractor class=page><div class=panel><h3>ผู้รับเหมา</h3><p>พร้อมต่อยอด</p></div></div>
<div id=report class=page><div class=panel><h3>รายงาน</h3><button id=backupBtn>สำรองข้อมูล</button></div></div>
<div id=settings class=page><div class=panel><button id=resetBtn>ล้างข้อมูล</button></div></div>

<div id=modal><div class=sheet><h3>เพิ่มรายการ</h3><input id=name placeholder='ชื่อรายการ'><select id=cat></select><input id=amt type=number placeholder='จำนวนเงิน'><button id=saveBtn>บันทึก</button><button id=cancelBtn style='background:#888'>ยกเลิก</button></div></div>

<nav>
<button data-page=home class=active>🏠<br>หน้าแรก</button>
<button data-page=budget>💰<br>งบ</button>
<button data-page=expense>💸<br>รายจ่าย</button>
<button data-page=contractor>👷<br>ผู้รับเหมา</button>
<button data-page=report>📄<br>รายงาน</button>
<button data-page=settings>⚙️<br>ตั้งค่า</button>
</nav>

<script>
const DB=JSON.parse(localStorage.getItem('bp52')||'{"budget":3000000,"cats":["ที่ดิน","ถมที่","โครงสร้าง","ไฟฟ้า","จัดสวน"],"items":[]}');
const $=id=>document.getElementById(id);
const colors=["#3b82f6","#ef4444","#f59e0b","#10b981","#8b5cf6","#64748b","#ec4899","#0ea5e9","#84cc16","#f97316"];
function save(){localStorage.setItem('bp52',JSON.stringify(DB))}
function drawPie(sums){
 const c=$("pie"),ctx=c.getContext("2d");ctx.clearRect(0,0,c.width,c.height);
 let total=Object.values(sums).reduce((a,b)=>a+b,0); if(!total){ctx.fillStyle="#999";ctx.fillText("ยังไม่มีข้อมูล",110,110);return;}
 let start=-Math.PI/2,i=0; for(const k of DB.cats){const v=sums[k]||0;if(v<=0)continue;const ang=v/total*Math.PI*2;ctx.beginPath();ctx.moveTo(160,110);ctx.arc(160,110,80,start,start+ang);ctx.closePath();ctx.fillStyle=colors[i++%colors.length];ctx.fill();start+=ang;}
}
function render(){
 $("cat").innerHTML=DB.cats.map(c=>`<option>${c}</option>`).join("");
 let sums={}; DB.cats.forEach(c=>sums[c]=0); DB.items.forEach(i=>sums[i.cat]+=i.amount);
 let spent=DB.items.reduce((t,i)=>t+i.amount,0);
 $("total").textContent=DB.budget.toLocaleString(); $("spent").textContent=spent.toLocaleString(); $("remain").textContent=(DB.budget-spent).toLocaleString(); $("percent").textContent=Math.round(spent/DB.budget*100)+"%";
 $("catList").innerHTML=DB.cats.map(c=>`<div class=row><span>${c}</span><b>${(sums[c]||0).toLocaleString()}</b></div>`).join("");
 $("itemList").innerHTML=DB.items.map((i,n)=>`<div class=row><span>${i.name}</span><span>${i.amount.toLocaleString()} <a href='#' data-del='${n}'>🗑️</a></span></div>`).join("")||"<p>ยังไม่มีรายการ</p>";
 document.querySelectorAll("[data-del]").forEach(a=>a.onclick=(e)=>{e.preventDefault();DB.items.splice(+a.dataset.del,1);save();render();});
 drawPie(sums); save();
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));$(b.dataset.page).classList.add("active");document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");});
$("openBtn").onclick=()=>$("modal").classList.add("show");
$("cancelBtn").onclick=()=>$("modal").classList.remove("show");
$("saveBtn").onclick=()=>{const n=$("name").value.trim(),a=+$("amt").value;if(!n||!a)return alert("กรอกข้อมูล");DB.items.push({name:n,cat:$("cat").value,amount:a});$("name").value="";$("amt").value="";$("modal").classList.remove("show");render();};
$("addCat").onclick=()=>{const c=$("newCat").value.trim();if(c&&!DB.cats.includes(c)){DB.cats.push(c);$("newCat").value="";render();}};
$("backupBtn").onclick=()=>{const blob=new Blob([JSON.stringify(DB,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="Budget-Pro-Backup.json";a.click();};
$("resetBtn").onclick=()=>{if(confirm("ล้างข้อมูลทั้งหมด?")){localStorage.removeItem("bp52");location.reload();}};
render();
</script></body></html>
