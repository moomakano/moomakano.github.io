<!doctype html><html lang='th'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Budget Pro v2</title><link rel='manifest' href='manifest.json'><script src='https://cdn.jsdelivr.net/npm/chart.js'></script><style>body{font-family:-apple-system;margin:0;background:#f5f7fb;padding-bottom:70px}header{background:linear-gradient(135deg,#0f766e,#2563eb);color:#fff;padding:18px}.page{display:none;padding:14px}.page.active{display:block}.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card,.panel{background:#fff;border-radius:16px;padding:14px}button,input,select{width:100%;padding:10px;margin-top:8px;border-radius:10px;border:1px solid #ddd}button{background:#2563eb;color:#fff;border:none}nav{position:fixed;bottom:0;left:0;right:0;height:64px;background:#fff;border-top:1px solid #ddd;display:flex}nav button{flex:1;background:#fff;color:#666;border:none}.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee}#m{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center}#m.show{display:flex}.sheet{background:#fff;padding:16px;border-radius:16px;width:90%;max-width:380px}.thumb{width:36px;height:36px;border-radius:8px;object-fit:cover}</style></head><body><header><h2>🏡 Budget Pro v2</h2></header><section id=h class='page active'><div class=cards><div class=card><div>งบรวม</div><b id=t></b></div><div class=card><div>ใช้ไป</div><b id=s></b></div><div class=card><div>คงเหลือ</div><b id=r></b></div><div class=card><div>%</div><b id=pc></b></div></div><div class=panel><button id=open>➕ เพิ่มรายการ</button><canvas id=pie height=150></canvas><canvas id=line height=150></canvas></div></section><section id=b class=page><div class=panel><div id=cl></div><input id=nc placeholder='เพิ่มหมวด'><button id=ac>เพิ่มหมวด</button></div></section><section id=e class=page><div class=panel id=list></div></section><section id=i class=page><div class=panel><input id=parts type=number value=10><button id=mk>สร้างงวด</button><div id=plist></div></div></section><section id=x class=page><div class=panel><button onclick='alert("PDF/Excel จะเพิ่มในเวอร์ชันถัดไป")'>Export</button></div></section><div id=m><div class=sheet><input id=n placeholder='รายการ'><select id=c></select><input id=a type=number placeholder='จำนวนเงิน'><input id=d type=date><input id=ph type=file accept='image/*'><button id=sv>บันทึก</button><button id=cc>ยกเลิก</button></div></div><nav><button data=h>🏠</button><button data=b>💰</button><button data=e>💸</button><button data=i>📄</button><button data=x>⚙️</button></nav><script>const db=JSON.parse(localStorage.bp2||'{"budget":3000000,"cats":["ที่ดิน","ถมที่","โครงสร้าง","ไฟฟ้า","จัดสวน"],"items":[],"pay":[]}');const $=i=>document.getElementById(i);let p,l;document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(b.dataset).classList.add('active')});function R(){$('c').innerHTML=db.cats.map(x=>`<option>${x}</option>`).join('');let sums={};db.cats.forEach(x=>sums[x]=0);db.items.forEach(x=>sums[x.c]+=x.a);let sp=db.items.reduce((t,x)=>t+x.a,0;$('t').textContent=db.budget.toLocaleString();$('s').textContent=sp.toLocaleString();$('r').textContent=(db.budget-sp).toLocaleString();$('pc').textContent=Math.round(sp/db.budget*100)+'%';$('cl').innerHTML=db.cats.map(x=>`<div class=row><span>${x}</span><b>${sums[x].toLocaleString()}</b></div>`).join('');$('list').innerHTML=db.items.map((x,i)=>`<div class=row><span>${x.img?`<img class=thumb src='${x.img}'>`:''} ${x.n}</span><span>${x.a.toLocaleString()} <a href='#' onclick='db.items.splice(${i},1);S();return false;'>🗑️</a></span></div>`).join('');if(p)p.destroy();p=new Chart($('pie'),{type:'pie',data:{labels:db.cats,datasets:[{data:db.cats.map(x=>sums[x])}]}});let m={};db.items.forEach(x=>{let k=x.d.slice(0,7);m[k]=(m[k]||0)+x.a});if(l)l.destroy();l=new Chart($('line'),{type:'line',data:{labels:Object.keys(m),datasets:[{data:Object.values(m)}]}});$('plist').innerHTML=db.pay.map((x,i)=>`<div class=row><span>งวด ${i+1}</span><span>${x.toLocaleString()}</span></div>`).join('')}function S(){localStorage.bp2=JSON.stringify(db);R()}$('open').onclick=()=>$('m').classList.add('show');$('cc').onclick=()=>$('m').classList.remove('show');$('ac').onclick=()=>{let v=$('nc').value.trim();if(v&&!db.cats.includes(v)){db.cats.push(v);$('nc').value='';S()}};$('mk').onclick=()=>{let n=+$('parts').value||1;db.pay=Array(n).fill(Math.round(db.budget/n));S()};$('sv').onclick=()=>{let f=$('ph').files[0];let done=img=>{db.items.push({n:$('n').value,c:$('c').value,a:+$('a').value,d:$('d').value||new Date().toISOString().slice(0,10),img});$('m').classList.remove('show');S()};if(f){let r=new FileReader();r.onload=e=>done(e.target.result);r.readAsDataURL(f)}else done('')};R();</script></body></html>
