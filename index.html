<!doctype html><html lang='th'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Budget Pro X v5.1</title><link rel='manifest' href='manifest.json'><script src='https://cdn.jsdelivr.net/npm/chart.js'></script><style>body{font-family:-apple-system;margin:0;background:#eef1f5;padding-bottom:82px}header{background:linear-gradient(135deg,#0f766e,#2563eb);color:#fff;padding:22px}.page{display:none}.page.active{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}.card,.panel{background:#fff;border-radius:18px;padding:16px}.btn{width:100%;padding:15px;border:none;border-radius:14px;background:#2563eb;color:#fff;font-weight:bold}.row{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:10px 0}nav{position:fixed;bottom:0;left:0;right:0;height:70px;background:#fff;border-top:1px solid #ddd;display:flex}nav button{flex:1;border:none;background:#fff;color:#666;font-size:12px}nav button.active{color:#2563eb;font-weight:bold}#m{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center}#m.show{display:flex}.sheet{background:#fff;border-radius:18px;padding:18px;width:92%;max-width:380px}input,select{width:100%;padding:12px;margin-top:8px;border-radius:10px;border:1px solid #ddd}</style></head><body><header><h2>🏡 Budget Pro X v5.1</h2><p>Offline + Local Save</p></header><section id=home class='page active'><div class=grid><div class=card><div>งบรวม</div><h2 id=t></h2></div><div class=card><div>ใช้ไป</div><h2 id=s></h2></div><div class=card><div>คงเหลือ</div><h2 id=r></h2></div><div class=card><div>%</div><h2 id=p></h2></div></div><div class='panel'><button class=btn id=open>➕ เพิ่มรายการ</button><canvas id=pie height=170></canvas></div><div class='panel'><h3>รายการล่าสุด</h3><div id=recent></div></div></section><section id=budget class=page><div class=panel><h3>Master Budget</h3><div id=cl></div><input id=nc placeholder='เพิ่มหมวดเอง'><button class=btn id=ac>เพิ่มหมวด</button></div></section><section id=exp class=page><div class=panel><h3>รายจ่ายทั้งหมด</h3><div id=list></div></div></section><section id=con class=page><div class=panel><h3>ผู้รับเหมา</h3><p>พร้อมต่อยอดในเวอร์ชันถัดไป</p></div></section><section id=rep class=page><div class=panel><h3>รายงาน</h3><p>พร้อมต่อยอด PDF/Excel</p></div></section><section id=set class=page><div class=panel><button class=btn onclick='backup()'>สำรองข้อมูล</button></div></section><div id=m><div class=sheet><h3>เพิ่มรายการ</h3><input id=n placeholder='ชื่อรายการ'><select id=c></select><input id=a type=number placeholder='จำนวนเงิน'><input id=d type=date><button class=btn id=sv>บันทึก</button><button class=btn id=cc style='background:#888;margin-top:8px'>ยกเลิก</button></div></div><nav><button data=home class=active>🏠<br>หน้าแรก</button><button data=budget>💰<br>งบ</button><button data=exp>💸<br>รายจ่าย</button><button data=con>👷<br>ผู้รับเหมา</button><button data=rep>📄<br>รายงาน</button><button data=set>⚙️<br>ตั้งค่า</button></nav><script>const DB=JSON.parse(localStorage.bp51||'{"budget":3000000,"categories":["ที่ดิน","ถมที่","เคลียริ่ง","โครงสร้าง","เขื่อน","ถนน","ไฟฟ้า","เครื่องใช้ไฟฟ้า","อุปกรณ์ตกแต่ง","รั้วบ้าน","จัดสวน"],"items":[]}');const $=i=>document.getElementById(i);let chart;document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));$(b.dataset).classList.add('active');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active')});function save(){localStorage.bp51=JSON.stringify(DB)}function render(){$('c').innerHTML=DB.categories.map(x=>`<option>${x}</option>`).join('');const sums={};DB.categories.forEach(x=>sums[x]=0);DB.items.forEach(x=>sums[x.category]+=x.amount);const spent=DB.items.reduce((t,x)=>t+x.amount,0);$('t').textContent=DB.budget.toLocaleString();$('s').textContent=spent.toLocaleString();$('r').textContent=(DB.budget-spent).toLocaleString();$('p').textContent=Math.round(spent/DB.budget*100)+'%';$('cl').innerHTML=DB.categories.map(x=>`<div class=row><span>${x}</span><b>${(sums[x]||0).toLocaleString()}</b></div>`).join('');const html=DB.items.map((x,i)=>`<div class=row><span>${x.name}</span><span>${x.amount.toLocaleString()} <a href=# onclick='DB.items.splice(${i},1);render();save();return false;'>🗑️</a></span></div>`).join('')||'<p>ยังไม่มีรายการ</p>';$('recent').innerHTML=html;$('list').innerHTML=html;if(chart)chart.destroy();chart=new Chart($('pie'),{type:'pie',data:{labels:DB.categories,datasets:[{data:DB.categories.map(x=>sums[x])}]},options:{plugins:{legend:{position:'bottom'}}}});save()}$('open').onclick=()=>$('m').classList.add('show');$('cc').onclick=()=>$('m').classList.remove('show');$('ac').onclick=()=>{let v=$('nc').value.trim();if(v&&!DB.categories.includes(v)){DB.categories.push(v);$('nc').value='';render()}};$('sv').onclick=()=>{let name=$('n').value.trim(),amt=+$('a').value;if(!name||!amt)return alert('กรอกข้อมูล');DB.items.push({name,category:$('c').value,amount:amt,date:$('d').value});$('n').value='';$('a').value='';$('m').classList.remove('show');render()};function backup(){let blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Budget-Pro-Backup.json';a.click()}render();</script></body></html>
