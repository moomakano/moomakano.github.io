<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#155e75"><link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png"><title>Budget Pro 8</title>
  <style>
    :root{--ink:#123047;--muted:#62758a;--brand:#0f766e;--line:#e5edf1;--bg:#f4f8f9;--red:#dc4c64;--amber:#e59b28;--blue:#2777bd}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);padding-bottom:88px}.top{background:linear-gradient(135deg,#0f766e,#155e75);color:#fff;padding:25px 20px 30px;border-radius:0 0 28px 28px}.top h1{font-size:22px;margin:0}.top p{margin:5px 0 0;opacity:.82;font-size:13px}.page{display:none;padding:18px;max-width:760px;margin:auto}.page.active{display:block}.summary{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:-20px}.card{background:#fff;border-radius:17px;padding:15px;box-shadow:0 3px 16px #15394b12}.card span,.label{font-size:12px;color:var(--muted)}.card b{display:block;font-size:19px;margin-top:4px}.card.teal{border-left:4px solid var(--brand)}.card.red{border-left:4px solid var(--red)}.card.amber{border-left:4px solid var(--amber)}.section{margin:22px 0 10px;font-size:17px}.panel{background:#fff;border-radius:17px;padding:16px;margin:12px 0;box-shadow:0 3px 16px #15394b0a}.chart-row{display:flex;align-items:center;gap:20px}.pie{width:145px;height:145px;border-radius:50%;background:conic-gradient(#0f766e 0 32%,#2777bd 32% 56%,#e59b28 56% 75%,#dc4c64 75% 88%,#94a3b8 88% 100%);position:relative;flex:none}.pie:after{content:"ใช้ไป";position:absolute;inset:27px;background:#fff;border-radius:50%;display:grid;place-items:center;font-size:12px;color:var(--muted)}.legend{font-size:12px;line-height:2}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}.bars{height:150px;display:flex;align-items:end;justify-content:space-around;gap:8px;border-bottom:1px solid var(--line)}.bar{background:linear-gradient(#2aa198,#0f766e);width:12%;border-radius:7px 7px 0 0;position:relative}.bar i{position:absolute;top:calc(100% + 5px);font-style:normal;font-size:10px;color:var(--muted);left:50%;transform:translateX(-50%)}.list-item{padding:13px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px}.list-item:last-child{border:0}.icon{width:38px;height:38px;border-radius:12px;background:#e6f5f3;display:grid;place-items:center;font-size:19px}.grow{flex:1}.amount{font-weight:700}.muted{color:var(--muted);font-size:12px}.progress{height:8px;background:#eaf0f3;border-radius:10px;overflow:hidden;margin-top:8px}.progress>i{display:block;height:100%;background:var(--brand);border-radius:10px}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px max(8px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom));z-index:4}.nav button{border:0;background:none;color:#718096;font-size:10px;min-width:53px;padding:4px 2px}.nav button strong{display:block;font-size:20px;font-weight:400;line-height:23px}.nav button.active{color:var(--brand)}button.primary,.add{border:0;background:var(--brand);color:white;padding:11px 15px;border-radius:12px;font-weight:650}.add{float:right;font-size:14px}.filters{display:flex;gap:8px;margin:14px 0}.filters input,.filters select,input,select{width:100%;border:1px solid #dbe6ea;border-radius:10px;padding:10px;background:#fff;color:var(--ink)}.actions button{border:0;background:#edf5f5;color:var(--brand);border-radius:8px;padding:7px;margin-left:3px}.empty{padding:26px;text-align:center;color:var(--muted)}dialog{border:0;border-radius:18px;width:min(92vw,440px);box-shadow:0 15px 50px #0004;padding:20px}dialog::backdrop{background:#082f4940}dialog h2{margin-top:0;font-size:19px}.field{margin:10px 0}.field label{display:block;font-size:12px;color:var(--muted);margin:0 0 4px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.modal-actions button{border:0;border-radius:10px;padding:10px 13px}.danger{color:var(--red)!important}.setting{cursor:pointer}.toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:#123047;color:white;padding:10px 15px;border-radius:10px;display:none;z-index:10;font-size:13px}@media(min-width:600px){.summary{grid-template-columns:repeat(4,1fr)}}
  </style>
</head>
<body>
<header class="top"><h1>Budget Pro 8</h1><p id="subtitle">ภาพรวมงบประมาณโครงการ</p></header><div id="toast" class="toast"></div>
<main>
  <section id="dashboard" class="page active"></section><section id="budget" class="page"></section><section id="expenses" class="page"></section><section id="contractors" class="page"></section><section id="payments" class="page"></section><section id="settings" class="page"></section>
</main>
<nav class="nav"><button class="active" data-page="dashboard"><strong>⌂</strong>หน้าแรก</button><button data-page="budget"><strong>▦</strong>งบหลัก</button><button data-page="expenses"><strong>฿</strong>รายจ่าย</button><button data-page="contractors"><strong>♙</strong>ผู้รับเหมา</button><button data-page="payments"><strong>▤</strong>งวดจ่าย</button><button data-page="settings"><strong>⚙</strong>ตั้งค่า</button></nav>
<dialog id="formDialog"><form id="dataForm" method="dialog"><h2 id="formTitle"></h2><div id="formFields"></div><div class="modal-actions"><button value="cancel">ยกเลิก</button><button class="primary" value="default">บันทึก</button></div></form></dialog>
<script>
const categories=['ที่ดิน','ถมที่','เคลียริ่ง','โครงสร้าง','เขื่อน','ถนน','ไฟฟ้า','เครื่องใช้ไฟฟ้า','อุปกรณ์ตกแต่ง','รั้วบ้าน','จัดสวน'];
const icons=['🏞️','⛰️','🧹','🏗️','🌊','🛣️','⚡','💡','🛋️','🏡','🌿'];
const defaults={projectName:'โครงการของฉัน',totalBudget:5000000,budgets:[600000,350000,120000,1800000,250000,380000,300000,250000,300000,300000,350000],expenses:[{id:1,date:'2026-09-01',category:'ถมที่',title:'ค่าถมดินรอบแรก',amount:125000,note:''},{id:2,date:'2026-09-05',category:'โครงสร้าง',title:'มัดจำเสาเข็ม',amount:180000,note:''}],contractors:[{id:3,name:'ช่างสมชาย ก่อสร้าง',phone:'081-234-5678',category:'โครงสร้าง',note:''}],payments:[{id:4,name:'งวดฐานราก',contractor:'ช่างสมชาย ก่อสร้าง',amount:300000,due:'2026-10-15',status:'รอดำเนินการ'}]};
let state=JSON.parse(localStorage.getItem('budgetPro8')||'null')||defaults;let activeForm=null,editing=null;
function save(){localStorage.setItem('budgetPro8',JSON.stringify(state));render();}function money(v){return new Intl.NumberFormat('th-TH',{maximumFractionDigits:0}).format(+v||0)+' ฿'}function spent(){return state.expenses.reduce((s,x)=>s+(+x.amount||0),0)}function esc(s=''){return String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}function toast(t){let x=document.querySelector('#toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2200)}
function dashboard(){let total=+state.totalBudget,used=spent(),pct=total?Math.round(used/total*100):0;let recent=[...state.expenses].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4);let month=[0,0,0,0,0,0];state.expenses.forEach(x=>{let m=new Date(x.date).getMonth();if(m>=3&&m<=8)month[m-3]+=+x.amount});let max=Math.max(...month,1);return `<div class="summary"><div class="card teal"><span>งบทั้งหมด</span><b>${money(total)}</b></div><div class="card red"><span>ใช้ไป</span><b>${money(used)}</b></div><div class="card amber"><span>คงเหลือ</span><b>${money(total-used)}</b></div><div class="card"><span>ใช้แล้ว</span><b>${pct}%</b></div></div><h2 class="section">สัดส่วนงบประมาณ</h2><div class="panel chart-row"><div class="pie"></div><div class="legend"><span class="dot" style="background:#0f766e"></span>โครงสร้าง<br><span class="dot" style="background:#2777bd"></span>ถมที่ / เคลียริ่ง<br><span class="dot" style="background:#e59b28"></span>งานระบบ<br><span class="dot" style="background:#dc4c64"></span>งานภายนอก</div></div><h2 class="section">รายจ่ายรายเดือน</h2><div class="panel"><div class="bars">${month.map((v,i)=>`<div class="bar" style="height:${Math.max(4,v/max*100)}%"><i>${['เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.'][i]}</i></div>`).join('')}</div></div><h2 class="section">รายการล่าสุด</h2><div class="panel">${recent.length?recent.map(expenseRow).join(''):'<div class="empty">ยังไม่มีรายการรายจ่าย</div>'}</div>`}
function expenseRow(x){return `<div class="list-item"><div class="icon">${icons[categories.indexOf(x.category)]||'💸'}</div><div class="grow"><b>${esc(x.title)}</b><div class="muted">${esc(x.category)} · ${x.date}</div></div><div><div class="amount">${money(x.amount)}</div></div></div>`}
function budget(){let usedBy=c=>state.expenses.filter(x=>x.category===c).reduce((s,x)=>s+(+x.amount||0),0);return `<button class="add" onclick="openForm('budget')">แก้งบรวม</button><h2 class="section">Master Budget</h2><p class="muted">กำหนดงบในแต่ละหมวด</p><div class="panel">${categories.map((c,i)=>{let u=usedBy(c),b=+state.budgets[i]||0,p=b?Math.min(100,u/b*100):0;return `<div class="list-item"><div class="icon">${icons[i]}</div><div class="grow"><b>${c}</b><div class="muted">ใช้ ${money(u)} จาก ${money(b)}</div><div class="progress"><i style="width:${p}%"></i></div></div><button class="actions" onclick="openForm('category',${i})">✎</button></div>`}).join('')}</div>`}
function expenses(){return `<button class="add" onclick="openForm('expense')">+ เพิ่มรายจ่าย</button><h2 class="section">รายจ่าย</h2><div class="filters"><input placeholder="ค้นหารายการ…" oninput="filterExpenses(this.value)"><select onchange="filterExpenses('',this.value)"><option value="">ทุกหมวด</option>${categories.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="panel" id="expenseList">${state.expenses.length?state.expenses.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class="list-item"><div class="icon">${icons[categories.indexOf(x.category)]||'💸'}</div><div class="grow"><b>${esc(x.title)}</b><div class="muted">${x.category} · ${x.date}</div></div><div><div class="amount">${money(x.amount)}</div><div class="actions"><button onclick="openForm('expense',${x.id})">แก้ไข</button><button class="danger" onclick="removeItem('expenses',${x.id})">ลบ</button></div></div></div>`).join(''):'<div class="empty">เพิ่มรายจ่ายรายการแรกของคุณ</div>'}</div>`}
function contractors(){return `<button class="add" onclick="openForm('contractor')">+ เพิ่มผู้รับเหมา</button><h2 class="section">ผู้รับเหมา</h2><div class="panel">${state.contractors.length?state.contractors.map(x=>`<div class="list-item"><div class="icon">👷</div><div class="grow"><b>${esc(x.name)}</b><div class="muted">${esc(x.category)} · ${esc(x.phone||'ไม่ระบุเบอร์')}</div></div><div class="actions"><button onclick="openForm('contractor',${x.id})">แก้ไข</button><button class="danger" onclick="removeItem('contractors',${x.id})">ลบ</button></div></div>`).join(''):'<div class="empty">ยังไม่มีข้อมูลผู้รับเหมา</div>'}</div>`}
function payments(){return `<button class="add" onclick="openForm('payment')">+ เพิ่มงวด</button><h2 class="section">งวดการจ่าย</h2><div class="panel">${state.payments.length?state.payments.map(x=>`<div class="list-item"><div class="icon">📄</div><div class="grow"><b>${esc(x.name)}</b><div class="muted">${esc(x.contractor)} · ครบกำหนด ${x.due}</div><div class="muted">สถานะ: ${esc(x.status)}</div></div><div><div class="amount">${money(x.amount)}</div><div class="actions"><button onclick="openForm('payment',${x.id})">แก้ไข</button><button class="danger" onclick="removeItem('payments',${x.id})">ลบ</button></div></div></div>`).join(''):'<div class="empty">ยังไม่มีงวดการจ่าย</div>'}</div>`}
function settings(){return `<h2 class="section">ตั้งค่า</h2><div class="panel"><div class="list-item setting" onclick="openForm('project')"><div class="icon">🏗️</div><div class="grow"><b>ข้อมูลโครงการ</b><div class="muted">${esc(state.projectName)} · งบ ${money(state.totalBudget)}</div></div><span>›</span></div><div class="list-item setting" onclick="exportData()"><div class="icon">💾</div><div class="grow"><b>สำรองข้อมูล</b><div class="muted">ดาวน์โหลดไฟล์ข้อมูล JSON</div></div><span>›</span></div><div class="list-item setting" onclick="document.querySelector('#importFile').click()"><div class="icon">↩️</div><div class="grow"><b>กู้คืนข้อมูล</b><div class="muted">นำเข้าจากไฟล์สำรอง</div></div><span>›</span></div><div class="list-item setting" onclick="exportCsv()"><div class="icon">📊</div><div class="grow"><b>ส่งออก Excel / CSV</b><div class="muted">ดาวน์โหลดรายการรายจ่าย</div></div><span>›</span></div></div><input id="importFile" type="file" accept="application/json" hidden onchange="importData(this)"><p class="muted">ข้อมูลทั้งหมดเก็บบนอุปกรณ์นี้โดยอัตโนมัติ</p>`}
function render(){document.querySelector('#subtitle').textContent=state.projectName+' · ภาพรวมงบประมาณ';document.querySelector('#dashboard').innerHTML=dashboard();document.querySelector('#budget').innerHTML=budget();document.querySelector('#expenses').innerHTML=expenses();document.querySelector('#contractors').innerHTML=contractors();document.querySelector('#payments').innerHTML=payments();document.querySelector('#settings').innerHTML=settings()}
const field=(l,n,t='text',v='')=>`<div class="field"><label>${l}</label><input required name="${n}" type="${t}" value="${esc(v)}"></div>`;const select=(l,n,opts,v='')=>`<div class="field"><label>${l}</label><select name="${n}">${opts.map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select></div>`;
function openForm(type,id){activeForm=type;editing=id;let x;if(type==='expense'){x=state.expenses.find(a=>a.id===id)||{date:new Date().toISOString().slice(0,10),category:categories[0]};setForm('รายจ่าย',field('รายการ','title','text',x.title)+field('จำนวนเงิน','amount','number',x.amount)+field('วันที่','date','date',x.date)+select('หมวด','category',categories,x.category)+field('หมายเหตุ','note','text',x.note))}else if(type==='contractor'){x=state.contractors.find(a=>a.id===id)||{category:categories[0]};setForm('ผู้รับเหมา',field('ชื่อผู้รับเหมา','name','text',x.name)+field('เบอร์โทรศัพท์','phone','tel',x.phone)+select('หมวดงาน','category',categories,x.category)+field('หมายเหตุ','note','text',x.note))}else if(type==='payment'){x=state.payments.find(a=>a.id===id)||{due:new Date().toISOString().slice(0,10),status:'รอดำเนินการ'};setForm('งวดการจ่าย',field('ชื่องวด','name','text',x.name)+field('ผู้รับเหมา','contractor','text',x.contractor)+field('ยอดเงิน','amount','number',x.amount)+field('วันครบกำหนด','due','date',x.due)+select('สถานะ','status',['รอดำเนินการ','จ่ายแล้ว','เกินกำหนด'],x.status))}else if(type==='category'){x=state.budgets[id];setForm('งบหมวด '+categories[id],field('งบประมาณ','amount','number',x))}else{setForm(type==='project'?'ข้อมูลโครงการ':'งบประมาณรวม',field(type==='project'?'ชื่อโครงการ':'งบประมาณรวม','value','text',type==='project'?state.projectName:state.totalBudget))}}
function setForm(title,fields){document.querySelector('#formTitle').textContent=title;document.querySelector('#formFields').innerHTML=fields;document.querySelector('#formDialog').showModal()}
document.querySelector('#dataForm').addEventListener('submit',e=>{if(e.submitter?.value==='cancel')return;let d=Object.fromEntries(new FormData(e.target));if(['expense','contractor','payment'].includes(activeForm)){let key=activeForm==='expense'?'expenses':activeForm==='contractor'?'contractors':'payments',arr=state[key],old=arr.find(x=>x.id===editing);if(old)Object.assign(old,d);else arr.push({...d,id:Date.now()})}else if(activeForm==='category')state.budgets[editing]=+d.amount;else if(activeForm==='project'){state.projectName=d.value}else state.totalBudget=+d.value;save();toast('บันทึกข้อมูลแล้ว')});
function removeItem(key,id){if(confirm('ต้องการลบรายการนี้ใช่หรือไม่?')){state[key]=state[key].filter(x=>x.id!==id);save();toast('ลบรายการแล้ว')}}function filterExpenses(q='',cat=''){let rows=state.expenses.filter(x=>(!q||x.title.toLowerCase().includes(q.toLowerCase()))&&(!cat||x.category===cat));document.querySelector('#expenseList').innerHTML=rows.length?rows.map(x=>`<div class="list-item"><div class="grow"><b>${esc(x.title)}</b><div class="muted">${x.category} · ${x.date}</div></div><div class="amount">${money(x.amount)}</div></div>`).join(''):'<div class="empty">ไม่พบรายการ</div>'}function exportData(){download('budget-pro-8-backup.json',JSON.stringify(state,null,2),'application/json')}function exportCsv(){let s='วันที่,รายการ,หมวด,จำนวนเงิน,หมายเหตุ\n'+state.expenses.map(x=>[x.date,x.title,x.category,x.amount,x.note].map(v=>'"'+String(v||'').replaceAll('"','""')+'"').join(',')).join('\n');download('budget-pro-8-expenses.csv','\ufeff'+s,'text/csv')}function download(n,s,t){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:t}));a.download=n;a.click();URL.revokeObjectURL(a.href)}function importData(i){let f=i.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{try{state=JSON.parse(r.result);save();toast('กู้คืนข้อมูลสำเร็จ')}catch{toast('ไฟล์สำรองไม่ถูกต้อง')}};r.readAsText(f)}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.querySelector('#'+b.dataset.page).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');window.scrollTo(0,0)});if('serviceWorker'in navigator){navigator.serviceWorker.register('./sw.js?v=2').then(reg=>{reg.update();let refreshed=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!refreshed){refreshed=true;window.location.reload()}})})};render();
</script></body></html>
