<!doctype html><html lang='th'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><link rel='manifest' href='manifest.json'><link rel='stylesheet' href='style.css'><title>Budget Pro V10</title></head><body><div class='top'><h1>🏡 Budget Pro V10 Ultimate</h1></div><div class='wrap'><div class='cards'><div class='card green'><small>งบรวม</small><h2>5,000,000</h2></div><div class='card blue'><small>ใช้ไป</small><h2 id='spent'>0</h2></div><div class='card yellow'><small>คงเหลือ</small><h2 id='remain'>5,000,000</h2></div><div class='card pink'><small>ความคืบหน้า</small><h2 id='progress'>0%</h2></div></div><div class='card' style='margin-top:16px'><h3>เพิ่มรายการ</h3><p><input id='item' placeholder='รายการ' style='width:100%;padding:12px'></p><p><input id='amt' type='number' placeholder='จำนวนเงิน' style='width:100%;padding:12px'></p><p><select id='status' style='width:100%;padding:12px'><option>ยังไม่จ่าย</option><option>มัดจำ</option><option>จ่ายแล้ว</option></select></p><button onclick='add()'>บันทึก</button></div><div class='card' style='margin-top:16px'><table><thead><tr><th>รายการ</th><th>จำนวน</th><th>สถานะ</th><th></th></tr></thead><tbody id='tb'></tbody></table></div></div><script src='app.js'></script></body></html>
