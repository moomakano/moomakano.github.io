<!DOCTYPE html><html lang='th'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Budget Pro 10 Builder</title>
<style>
body{margin:0;font-family:-apple-system;background:#eef3f8}header{background:linear-gradient(135deg,#0f766e,#2563eb);color:#fff;padding:18px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:10px;border-top:1px solid #ddd}
.page{display:none;padding:16px 16px 90px}.active{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{padding:14px;border-radius:16px}.g{background:#dcfce7}.b{background:#dbeafe}.y{background:#fef3c7}.p{background:#fce7f3}
.box{background:#fff;border-radius:14px;padding:12px;margin:10px 0}button{padding:10px;border-radius:10px;border:none;background:#2563eb;color:#fff}input,select{width:100%;padding:10px;border:1px solid #ccc;border-radius:10px;margin:6px 0;box-sizing:border-box}
#modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center}.modal{background:#fff;padding:18px;border-radius:18px;width:92%;max-width:380px}
</style></head><body>
<header><h2>🏡 Budget Pro 10 Builder</h2></header>
<div class='grid' style='padding:12px'><div class='card g'>งบรวม<br><b id=t>5,000,000</b></div><div class='card b'>ใช้ไป<br><b id=u>0</b></div><div class='card y'>คงเหลือ<br><b id=l>5,000,000</b></div><div class='card p'>คืบหน้า<br><b id=p>0%</b></div></div>
<section id=home class='page active'><div class=box><h3>ตั้งค่าโครงการ</h3><input id=budget type=number placeholder='งบทั้งหมด'><input id=stages type=number placeholder='จำนวนงวด'><button onclick='createStages()'>สร้างงวดอัตโนมัติ</button></div></section>
<section id=pay class=page><div id=stageList></div><button onclick='openStage()'>+ เพิ่มงวดเอง</button></section>
<section id=exp class=page><div id=expList></div></section>
<section id=set class=page><button onclick='localStorage.clear();location.reload()'>ล้างข้อมูล</button></section>
<div id=modal><div class=modal><h3>เพิ่ม/แก้ไขงวด</h3><input id=sn placeholder='ชื่องวด'><input id=sa type=number placeholder='จำนวนเงิน'><input id=sd type=date><select id=ss><option>รอจ่าย</option><option>จ่ายแล้ว</option><option>ค้างชำระ</option></select><button onclick='saveStage()'>บันทึก</button></div></div>
<nav><button onclick="show('home')">🏠</button><button onclick="show('pay')">📄</button><button onclick="show('exp')">💸</button><button onclick="show('set')">⚙️</button></nav>
<script>
let B=+localStorage.bpBudget||5000000;let S=JSON.parse(localStorage.bpStages||'[]');let edit=-1;
const $=i=>document.getElementById(i);
function show(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');render();}
function createStages(){B=+$('budget').value||B;let n=+$('stages').value||0;if(!n)return alert('ใส่งวด');S=[];let each=Math.round(B/n);for(let i=1;i<=n;i++)S.push({name:'งวด '+i,amount:each,date:'',status:'รอจ่าย'});save();}
function openStage(i=-1){edit=i;$('modal').style.display='flex';if(i>=0){let s=S[i];sn.value=s.name;sa.value=s.amount;sd.value=s.date;ss.value=s.status}else{sn.value='';sa.value='';sd.value='';ss.value='รอจ่าย'}}
function saveStage(){let o={name:sn.value||'งวดใหม่',amount:+sa.value||0,date:sd.value,status:ss.value};if(edit>=0)S[edit]=o;else S.push(o);$('modal').style.display='none';save();}
function del(i){S.splice(i,1);save();}
function save(){localStorage.bpBudget=B;localStorage.bpStages=JSON.stringify(S);render();}
function render(){t.textContent=B.toLocaleString();let paid=S.filter(x=>x.status==='จ่ายแล้ว').reduce((a,b)=>a+b.amount,0);u.textContent=paid.toLocaleString();l.textContent=(B-paid).toLocaleString();p.textContent=Math.round(paid/B*100)+'%';stageList.innerHTML=S.map((s,i)=>`<div class=box><b>${s.name}</b><br>${s.amount.toLocaleString()} บาท<br>${s.date||'-'}<br>${s.status}<br><button onclick='openStage(${i})'>แก้ไข</button> <button onclick='del(${i})'>ลบ</button></div>`).join('');expList.innerHTML=S.filter(x=>x.status==='จ่ายแล้ว').map(s=>`<div class=box>${s.name} - ${s.amount.toLocaleString()}</div>`).join('');}
render();
</script></body></html>
