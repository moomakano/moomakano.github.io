<!doctype html><html lang='th'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Budget Pro</title><link rel='manifest' href='manifest.json'><link rel='stylesheet' href='style.css'></head><body><div class='app'><aside class='side'><h2>🏡 Budget Pro</h2><a class='active'>Dashboard</a><a>รายจ่าย</a><a>ผู้รับเหมา</a><a>รายงาน</a><a>ปฏิทิน</a><a>PDF/Excel</a><a>ตั้งค่า</a></aside><main class='main'><div class='top'><div><h2>โครงการสร้างบ้าน</h2><small>Budget Pro V11 Fix</small></div><button id='open'>+ เพิ่มรายการ</button></div><div class='cards'><div class='card g'><small>งบรวม</small><h2 id='b'>5,000,000</h2></div><div class='card b'><small>ใช้ไป</small><h2 id='s'>0</h2></div><div class='card y'><small>คงเหลือ</small><h2 id='r'>5,000,000</h2></div><div class='card p'><small>ความคืบหน้า</small><h2 id='p'>0%</h2></div></div><div class='toolbar'><input id='search' placeholder='ค้นหา'><select id='filter'><option value=''>ทุกสถานะ</option><option>จ่ายแล้ว</option><option>มัดจำ</option><option>ยังไม่จ่าย</option></select></div><table><thead><tr><th>รายการ</th><th>ผู้รับเหมา</th><th>จำนวน</th><th>สถานะ</th></tr></thead><tbody id='rows'></tbody></table></main></div><div id='modal' class='modal'><div class='box'><h3>เพิ่มรายการ</h3><div class='grid'><input id='item' placeholder='รายการ'><input id='con' placeholder='ผู้รับเหมา'><input id='amt' type='number' placeholder='จำนวนเงิน'><select id='status'><option>จ่ายแล้ว</option><option>มัดจำ</option><option>ยังไม่จ่าย</option></select><button id='save'>บันทึก</button><button id='close'>ยกเลิก</button></div></div></div><script src='app.js'></script></body></html>
