
<!doctype html><html lang="th"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Budget Pro Mini</title>
<link rel="manifest" href="manifest.json">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<style>
body{font-family:-apple-system;margin:0;background:#f5f7fb;padding-bottom:70px}header{background:linear-gradient(135deg,#0f766e,#2563eb);color:#fff;padding:18px}
.page{display:none;padding:14px}.active{display:block}.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#fff;border-radius:16px;padding:14px}
.panel{background:#fff;border-radius:16px;padding:14px;margin-top:12px}button,input,select{width:100%;padding:11px;margin-top:8px;border-radius:12px;border:1px solid #ddd;box-sizing:border-box}button{background:#2563eb;color:#fff;border:none}
nav{position:fixed;bottom:0;left:0;right:0;height:64px;background:#fff;border-top:1px solid #ddd;display:flex}nav button{flex:1;background:#fff;color:#666;border:none}
#modal{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center}#modal.show{display:flex}.sheet{background:#fff;padding:16px;border-radius:18px;width:92%;max-width:380px}
.row{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:8px 0}
img.thumb{width:36px;height:36px;object-fit:cover;border-radius:8px}
</style></head><body>
<header><h2>🏡 Budget Pro Mini</h2></header>
<section id=home class="page active"><div class=cards><div class=card><div>งบรวม</div><b id=t>3000000</b></div><div class=card><div>ใช้ไป</div><b id=s>0</b></div><div class=card><div>คงเหลือ</div><b id=r>3000000</b></div><div class=card><div>%</div><b id=p>0%</b></div></div><div class=panel><button id=open>➕ เพิ่มรายการ</button><canvas id=pie height=160></canvas><canvas id=line height=160></canvas></div></section>
<section id=budget class=page><div class=panel><div id=catList></div><input id=newCat placeholder="เพิ่มหมวดเอง"><button id=addCat>เพิ่มหมวด</button></div></section>
<section id=expense class=page><div class=panel><div id=list></div></div></section>
<section id=settings class=page><div class=panel><button id=pdf>Export PDF</button><button id=excel>Export Excel</button></div></section>
<div id=modal><div class=sheet><input id=name placeholder="ชื่อรายการ"><select id=cat></select><input id=amt type=number placeholder="จำนวนเงิน"><input id=date type=date><input id=photo type=file accept="image/*"><button id=save>บันทึก</button><button id=close>ยกเลิก</button></div></div>
<nav><button data=home>🏠</button><button data=budget>💰</button><button data=expense>💸</button><button data=settings>⚙️</button></nav>
<script>
const db=JSON.parse(localStorage.bpmini||'{"budget":3000000,"cats":["ที่ดิน","ถมที่","โครงสร้าง","ไฟฟ้า","จัดสวน"],"items":[]}'); const $=id=>document.getElementById(id); let pie,line;
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));$(b.dataset).classList.add("active");});
$("open").onclick=()=>$("modal").classList.add("show");$("close").onclick=()=>$("modal").classList.remove("show");
$("addCat").onclick=()=>{let c=$("newCat").value.trim();if(c&&!db.cats.includes(c)){db.cats.push(c);$("newCat").value="";render();}};
$("save").onclick=()=>{let fr=new FileReader();const done=(img)=>{db.items.push({n:$("name").value,c:$("cat").value,a:+$("amt").value,d:$("date").value||new Date().toISOString().slice(0,10),img});localStorage.bpmini=JSON.stringify(db);$("modal").classList.remove("show");render();}; if($("photo").files[0]){fr.onload=e=>done(e.target.result);fr.readAsDataURL($("photo").files[0]);}else done("");};
$("pdf").onclick=()=>{const {jsPDF}=window.jspdf;let pdf=new jsPDF();pdf.text("Budget Pro",20,20);db.items.forEach((i,n)=>pdf.text(`${i.d} ${i.n} ${i.a}`,20,35+n*8));pdf.save("Budget-Pro.pdf");};
$("excel").onclick=()=>{let ws=XLSX.utils.json_to_sheet(db.items);let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Budget");XLSX.writeFile(wb,"Budget-Pro.xlsx");};
function render(){ $("cat").innerHTML=db.cats.map(c=>`<option>${c}</option>`).join(""); let sums={}; db.cats.forEach(c=>sums[c]=0); db.items.forEach(i=>sums[i.c]=(sums[i.c]||0)+i.a); let spent=db.items.reduce((t,i)=>t+i.a,0); $("t").textContent=db.budget.toLocaleString();$("s").textContent=spent.toLocaleString();$("r").textContent=(db.budget-spent).toLocaleString();$("p").textContent=Math.round(spent/db.budget*100)+"%"; $("catList").innerHTML=db.cats.map(c=>`<div class=row><span>${c}</span><b>${(sums[c]||0).toLocaleString()}</b></div>`).join(""); $("list").innerHTML=db.items.map((i,idx)=>`<div class=row><span>${i.img?`<img class=thumb src='${i.img}'>`:""} ${i.n}</span><span>${i.a.toLocaleString()} <a href='#' onclick='db.items.splice(${idx},1);localStorage.bpmini=JSON.stringify(db);render();return false;'>🗑️</a></span></div>`).join(""); if(pie)pie.destroy(); pie=new Chart($("pie"),{type:"pie",data:{labels:db.cats,datasets:[{data:db.cats.map(c=>sums[c])}]}}); const m={}; db.items.forEach(i=>{let k=i.d.slice(0,7);m[k]=(m[k]||0)+i.a}); if(line)line.destroy(); line=new Chart($("line"),{type:"line",data:{labels:Object.keys(m),datasets:[{data:Object.values(m)}]}}); localStorage.bpmini=JSON.stringify(db);}
render();
</script></body></html>
