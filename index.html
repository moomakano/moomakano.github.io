<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Budget Pro V11</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#eef1f4;font-family:-apple-system,BlinkMacSystemFont}
header{background:linear-gradient(135deg,#0d8a55,#1565ff);color:#fff;padding:18px;display:flex;align-items:center;gap:12px}
.menu{font-size:30px;background:none;border:none;color:#fff}
.side{position:fixed;left:-260px;top:0;width:250px;height:100%;background:#0d5c55;color:#fff;padding:20px;transition:.25s;z-index:10}
.side.show{left:0}
.side a{display:block;color:#fff;text-decoration:none;padding:12px 0}
.main{padding:16px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{padding:18px;border-radius:18px;font-weight:bold}
.c1{background:#d9f4c6}
.c2{background:#cfe0ff}
.c3{background:#f6e79b}
.c4{background:#f7d2ea}
.top{display:flex;justify-content:space-between;align-items:center;margin:18px 0}
.plus{width:56px;height:56px;border-radius:50%;border:none;background:#14a44d;color:#fff;font-size:34px}
.table{background:#fff;border-radius:18px;padding:12px}
.search{width:100%;padding:10px;border:1px solid #ccc;border-radius:10px;margin-bottom:10px}
table{width:100%;border-collapse:collapse}
th{background:#1e88e5;color:#fff}
th,td{padding:10px;border-bottom:1px solid #eee;text-align:left}
.modal{display:none;position:fixed;inset:0;background:#0006;justify-content:center;align-items:center;padding:20px}
.box{background:#fff;border-radius:20px;padding:20px;width:100%;max-width:380px}
.box input,.box select{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:10px}
.save{width:100%;padding:13px;background:#14a44d;color:#fff;border:none;border-radius:12px;font-size:16px}
</style>
</head>
<body>

<div id="side" class="side">
<h2>🏡 Budget Pro</h2>
<a href="#">🏠 หน้าหลัก</a>
<a href="#">💸 รายจ่าย</a>
<a href="#">👷 ผู้รับเหมา</a>
<a href="#">📑 งวดจ่าย</a>
<a href="#">📊 กราฟ</a>
<a href="#">📄 Export</a>
<a href="#">⚙️ ตั้งค่า</a>
</div>

<header>
<button class="menu" onclick="toggleMenu()">☰</button>
<h1>🏡 Budget Pro V11</h1>
</header>

<div class="main">

<h2>โครงการสร้างบ้าน</h2>

<div class="cards">
<div class="card c1">งบรวม<br><span id="budget">5,000,000</span></div>
<div class="card c2">ใช้ไป<br><span id="spent">0</span></div>
<div class="card c3">คงเหลือ<br><span id="remain">5,000,000</span></div>
<div class="card c4">ความคืบหน้า<br><span id="progress">0%</span></div>
</div>

<div class="top">
<h3>รายการค่าใช้จ่าย</h3>
<button class="plus" onclick="openModal()">+</button>
</div>

<div class="table">
<input id="search" class="search" placeholder="ค้นหา..." oninput="render()">

<table>
<thead>
<tr>
<th>รายการ</th>
<th>หมวด</th>
<th>จำนวน</th>
<th>ลบ</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

</div>

<div id="modal" class="modal">
<div class="box">
<h3>เพิ่มรายการ</h3>
<input id="name" placeholder="ชื่อรายการ">
<select id="cat">
<option>โครงสร้าง</option>
<option>ช่าง</option>
<option>ไฟฟ้า</option>
<option>ประปา</option>
<option>วัสดุ</option>
<option>อื่นๆ</option>
</select>
<input id="money" type="number" placeholder="จำนวนเงิน">
<button class="save" onclick="addItem()">บันทึก</button>
</div>
</div>

<script>
const total=5000000;
let data=JSON.parse(localStorage.getItem("budgetData")||"[]");

function toggleMenu(){
document.getElementById("side").classList.toggle("show");
}

function openModal(){
document.getElementById("modal").style.display="flex";
}

window.onclick=e=>{
if(e.target.id==="modal")document.getElementById("modal").style.display="none";
}

function addItem(){
const name=document.getElementById("name").value.trim();
const cat=document.getElementById("cat").value;
const money=Number(document.getElementById("money").value);

if(!name||!money)return alert("กรอกข้อมูลให้ครบ");

data.unshift({name,cat,money});
localStorage.setItem("budgetData",JSON.stringify(data));

document.getElementById("name").value="";
document.getElementById("money").value="";
document.getElementById("modal").style.display="none";

render();
}

function del(i){
data.splice(i,1);
localStorage.setItem("budgetData",JSON.stringify(data));
render();
}

function render(){

const q=document.getElementById("search").value.toLowerCase();
const body=document.getElementById("tbody");
body.innerHTML="";

let spent=0;

data.forEach((x,i)=>{
spent+=x.money;
if(x.name.toLowerCase().includes(q)||x.cat.toLowerCase().includes(q)){
body.innerHTML+=`
<tr>
<td>${x.name}</td>
<td>${x.cat}</td>
<td>${x.money.toLocaleString()}</td>
<td><button onclick="del(${i})">🗑️</button></td>
</tr>`;
}
});

document.getElementById("budget").textContent=total.toLocaleString();
document.getElementById("spent").textContent=spent.toLocaleString();
document.getElementById("remain").textContent=(total-spent).toLocaleString();
document.getElementById("progress").textContent=Math.round(spent/total*100)+"%";
}

render();
</script>

</body>
</html>
