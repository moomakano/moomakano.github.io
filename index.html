<!DOCTYPE html><html lang='th'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Budget Pro 8 Premium</title><link rel='manifest' href='manifest.json'><script src='https://cdn.jsdelivr.net/npm/chart.js'></script><style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f5f7fb;margin:0;padding-bottom:80px}
header{background:linear-gradient(135deg,#0f766e,#2563eb);color:#fff;padding:18px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px}
.card{border-radius:18px;padding:16px;font-weight:700}.g{background:#dcfce7}.b{background:#dbeafe}.y{background:#fef3c7}.p{background:#fce7f3}
.box{background:#fff;margin:12px;padding:14px;border-radius:16px}
button{background:#2563eb;color:#fff;border:none;border-radius:12px;padding:12px 14px}
input,select{width:100%;padding:10px;margin:6px 0;border:1px solid #ddd;border-radius:10px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:10px}
#modal{display:none;position:fixed;inset:0;background:#0007;align-items:center;justify-content:center}
#modal .c{background:#fff;width:92%;max-width:360px;border-radius:16px;padding:16px}
</style></head><body><header><h2>Budget Pro 8 Premium</h2></header>
<div class='cards'><div class='card g'>งบรวม<div id=t></div></div><div class='card b'>ใช้ไป<div id=s></div></div><div class='card y'>คงเหลือ<div id=r></div></div><div class='card p'>ความคืบหน้า<div id=p></div></div></div>
<div class='box'><button onclick='modal.style.display="flex"'>➕ เพิ่มรายการ</button></div>
<div class='box'><canvas id=pie height=220></canvas></div>
<div class='box'><canvas id=bar height=220></canvas></div>
<div id=modal><div class=c><h3>เพิ่มรายการ</h3><input id=n placeholder='ชื่อรายการ'><select id=cat><option>ที่ดิน</option><option>ถมที่</option><option>เคลียริ่ง</option><option>โครงสร้าง</option><option>เขื่อน</option><option>ถนน</option><option>ไฟฟ้า</option><option>เครื่องใช้ไฟฟ้า</option><option>อุปกรณ์ตกแต่ง</option><option>รั้วบ้าน</option><option>จัดสวน</option></select><input id=a type=number placeholder='จำนวนเงิน'><button onclick='add()'>บันทึก</button></div></div>
<nav><div>🏠</div><div>💰</div><div>💸</div><div>👷</div><div>📄</div><div>⚙️</div></nav>
<script>
let db=JSON.parse(localStorage.bp8||'{"budget":5800000,"items":[]}');
let pieChart,barChart;
function add(){db.items.push({name:n.value,cat:cat.value,amt:+a.value||0,date:new Date().toISOString()});localStorage.bp8=JSON.stringify(db);modal.style.display='none';render();}
function render(){let spent=db.items.reduce((s,i)=>s+i.amt,0);t.textContent=db.budget.toLocaleString();s.textContent=spent.toLocaleString();r.textContent=(db.budget-spent).toLocaleString();p.textContent=Math.round(spent/db.budget*100)+'%';
let cats={};db.items.forEach(i=>cats[i.cat]=(cats[i.cat]||0)+i.amt);if(pieChart)pieChart.destroy();pieChart=new Chart(pie,{type:'pie',data:{labels:Object.keys(cats),datasets:[{data:Object.values(cats)}]}});
let months=new Array(12).fill(0);db.items.forEach(i=>months[new Date(i.date).getMonth()]+=i.amt);if(barChart)barChart.destroy();barChart=new Chart(bar,{type:'bar',data:{labels:['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'],datasets:[{label:'รายเดือน',data:months}]}});}
render();
</script></body></html>
