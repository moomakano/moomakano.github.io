<!DOCTYPE html><html lang='th'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Budget Pro 8 Premium</title><link rel='manifest' href='manifest.json'><script src='https://cdn.jsdelivr.net/npm/chart.js'></script><style>
body{font-family:-apple-system,Arial;margin:0;background:#f3f6fb}header{background:linear-gradient(135deg,#0f766e,#2563eb);color:#fff;padding:18px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px}.card{border-radius:16px;padding:14px}.g{background:#dcfce7}.b{background:#dbeafe}.y{background:#fef3c7}.p{background:#fce7f3}.box{background:#fff;margin:12px;padding:12px;border-radius:14px}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:10px}button,input{padding:10px;border-radius:10px;border:1px solid #ccc}button{background:#2563eb;color:#fff;border:none}#m{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center}.modal{background:#fff;padding:16px;border-radius:16px;width:90%;max-width:360px}
</style></head><body><header><h2>Budget Pro 8 Premium</h2></header>
<div class='cards'><div class='card g'><b>งบรวม</b><div id=t></div></div><div class='card b'><b>ใช้ไป</b><div id=s></div></div><div class='card y'><b>คงเหลือ</b><div id=r></div></div><div class='card p'><b>คืบหน้า</b><div id=pc></div></div></div>
<div class='box'><button onclick='openAdd()'>+ เพิ่มรายการ</button></div>
<div class='box'><input id=q placeholder='ค้นหา' oninput='render()'></div>
<div class='box'><h3>รายจ่าย</h3><div id=list></div></div>
<div class='box'><h3>ผู้รับเหมา</h3><input id=cn placeholder='ชื่อ'><input id=cp placeholder='เบอร์'><button onclick='saveC()'>เพิ่มผู้รับเหมา</button><div id=cl></div></div>
<div class='box'><h3>งวดการจ่าย</h3><input id=dd type=date><button onclick='saveD()'>เพิ่มกำหนดจ่าย</button><div id=dl></div></div>
<div class='box'><canvas id=pie height=220></canvas></div>
<div id=m><div class='modal'><h3>เพิ่มรายจ่าย</h3><input id=n placeholder='รายการ'><input id=a type=number placeholder='จำนวนเงิน'><select id=c><option>โครงสร้าง</option><option>เครื่องใช้ไฟฟ้า</option><option>อุปกรณ์ตกแต่ง</option><option>จัดสวน</option></select><button onclick='add()'>บันทึก</button></div></div>
<nav><div>🏠</div><div>💰</div><div>💸</div><div>👷</div><div>📄</div><div>⚙️</div></nav>
<script>
let db=JSON.parse(localStorage.bp8||'{"budget":5800000,"items":[],"contractors":[],"dues":[]}');
let chart;
function openAdd(){m.style.display='flex'}
function add(){db.items.push({n:n.value,a:+a.value,c:c.value});localStorage.bp8=JSON.stringify(db);m.style.display='none';n.value='';a.value='';render()}
function del(i){db.items.splice(i,1);localStorage.bp8=JSON.stringify(db);render()}
function saveC(){db.contractors.push({n:cn.value,p:cp.value});localStorage.bp8=JSON.stringify(db);cn.value='';cp.value='';render()}
function saveD(){db.dues.push(dd.value);localStorage.bp8=JSON.stringify(db);dd.value='';render()}
function render(){let spent=db.items.reduce((x,y)=>x+y.a,0);t.textContent=db.budget.toLocaleString();s.textContent=spent.toLocaleString();r.textContent=(db.budget-spent).toLocaleString();pc.textContent=Math.round(spent/db.budget*100)+'%';let qv=q.value.toLowerCase();list.innerHTML=db.items.map((x,i)=>({x,i})).filter(o=>o.x.n.toLowerCase().includes(qv)||o.x.c.toLowerCase().includes(qv)).map(o=>`<div>${o.x.n} - ${o.x.a.toLocaleString()} (${o.x.c}) <button onclick='del(${o.i})'>ลบ</button></div>`).join('');cl.innerHTML=db.contractors.map(c=>`<div>${c.n} - ${c.p}</div>`).join('');dl.innerHTML=db.dues.map(d=>`<div>ครบกำหนด ${d}</div>`).join('');let m={};db.items.forEach(i=>m[i.c]=(m[i.c]||0)+i.a);let labels=Object.keys(m),data=Object.values(m);if(chart)chart.destroy();chart=new Chart(pie,{type:'pie',data:{labels,datasets:[{data}]}})}
render();if('serviceWorker'in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script></body></html>
