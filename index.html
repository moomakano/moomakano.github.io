
<!doctype html><html lang="th"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Budget Pro 9 Stable</title>
<link rel="manifest" href="manifest.json">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;background:#F4F7FB;padding-bottom:84px}
header{background:linear-gradient(135deg,#0F766E,#2563EB);color:#fff;padding:18px}
.page{display:none}.page.active{display:block}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:14px}
.card{padding:16px;border-radius:18px;font-weight:700}
.g{background:#DCFCE7}.b{background:#DBEAFE}.y{background:#FEF3C7}.p{background:#FCE7F3}
.box{background:#fff;margin:12px;border-radius:18px;padding:14px;box-shadow:0 6px 20px rgba(0,0,0,.05)}
input,select{width:100%;padding:11px;margin:6px 0;border:1px solid #ddd;border-radius:12px;box-sizing:border-box}
button{border:none;border-radius:12px;padding:11px 14px;background:#2563EB;color:#fff}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:8px 0}
nav button{background:none;color:#666;font-size:20px}nav button.active{color:#2563EB}
#modal{display:none;position:fixed;inset:0;background:#0007;align-items:center;justify-content:center}
#modal .sheet{background:#fff;width:92%;max-width:380px;border-radius:20px;padding:16px}
</style></head><body>
<header><h2>🏡 Budget Pro 9 Stable</h2><div>ข้อมูลบันทึกอัตโนมัติ</div></header>

<section id="dash" class="page active">
<div class="cards">
<div class="card g">งบรวม<div id=t></div></div>
<div class="card b">ใช้ไป<div id=s></div></div>
<div class="card y">คงเหลือ<div id=r></div></div>
<div class="card p">ความคืบหน้า<div id=pc></div></div></div>
<div class="box"><button onclick="openAdd()">➕ เพิ่มรายการ</button></div>
<div class="box"><canvas id=pie height=200></canvas></div>
<div class="box"><canvas id=bar height=200></canvas></div>
</section>

<section id="budget" class="page"><div class="box"><h3>Master Budget</h3><div id=budgetList></div></div></section>
<section id="exp" class="page"><div class="box"><input id=q placeholder="ค้นหา" oninput="render()"><div id=expenseList></div></div></section>
<section id="con" class="page"><div class="box"><input id=cn placeholder="ชื่อผู้รับเหมา"><input id=cp placeholder="เบอร์โทร"><button onclick="addContractor()">บันทึก</button><div id=contractorList></div></div></section>
<section id="pay" class="page"><div class="box"><input id=due type=date><button onclick="addDue()">เพิ่มงวด</button><div id=dueList></div></div></section>
<section id="set" class="page"><div class="box"><input id=budgetInput type=number><button onclick="saveBudget()">บันทึกงบ</button><button onclick="backup()">สำรองข้อมูล</button><button onclick="restore()">กู้คืน</button></div></section>

<div id=modal><div class=sheet><h3>เพิ่มรายการ</h3>
<input id=n placeholder="ชื่อรายการ">
<select id=cat>
<option>ที่ดิน</option><option>ถมที่</option><option>เคลียริ่ง</option><option>โครงสร้าง</option><option>เขื่อน</option><option>ถนน</option><option>ไฟฟ้า</option><option>เครื่องใช้ไฟฟ้า</option><option>อุปกรณ์ตกแต่ง</option><option>รั้วบ้าน</option><option>จัดสวน</option></select>
<input id=a type=number placeholder="จำนวนเงิน">
<button onclick="addExpense()">บันทึก</button></div></div>

<nav>
<button data-page=dash class=active>🏠</button>
<button data-page=budget>💰</button>
<button data-page=exp>💸</button>
<button data-page=con>👷</button>
<button data-page=pay>📄</button>
<button data-page=set>⚙️</button>
</nav>

<script>
const CATS=["ที่ดิน","ถมที่","เคลียริ่ง","โครงสร้าง","เขื่อน","ถนน","ไฟฟ้า","เครื่องใช้ไฟฟ้า","อุปกรณ์ตกแต่ง","รั้วบ้าน","จัดสวน"];
let db=JSON.parse(localStorage.getItem("bp9")||'{"budget":5800000,"expenses":[],"contractors":[],"dues":[]}');
let pieChart,barChart;
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));document.getElementById(b.dataset.page).classList.add("active");document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");});
function save(){localStorage.setItem("bp9",JSON.stringify(db));render();}
function openAdd(){modal.style.display="flex";}
function addExpense(){if(!n.value||!a.value)return alert("กรอกข้อมูลให้ครบ");db.expenses.push({name:n.value,cat:cat.value,amt:+a.value,date:new Date().toISOString()});modal.style.display="none";n.value="";a.value="";save();}
function del(i){db.expenses.splice(i,1);save();}
function addContractor(){if(!cn.value)return;db.contractors.push({name:cn.value,phone:cp.value});cn.value="";cp.value="";save();}
function addDue(){if(!due.value)return;db.dues.push(due.value);due.value="";save();}
function saveBudget(){db.budget=+budgetInput.value||db.budget;save();}
function backup(){localStorage.setItem("bp9_backup",JSON.stringify(db));alert("สำรองข้อมูลแล้ว");}
function restore(){const b=localStorage.getItem("bp9_backup");if(!b)return alert("ไม่พบข้อมูลสำรอง");db=JSON.parse(b);save();}
function render(){budgetInput.value=db.budget;let spent=db.expenses.reduce((a,b)=>a+b.amt,0);t.textContent=db.budget.toLocaleString();s.textContent=spent.toLocaleString();r.textContent=(db.budget-spent).toLocaleString();pc.textContent=Math.round(spent/db.budget*100)+"%";
const qv=(q?q.value:"").toLowerCase();expenseList.innerHTML=db.expenses.map((e,i)=>({e,i})).filter(o=>o.e.name.toLowerCase().includes(qv)||o.e.cat.toLowerCase().includes(qv)).map(o=>`<div class=row><div><b>${o.e.name}</b><br>${o.e.cat}</div><div>${o.e.amt.toLocaleString()}<br><button onclick="del(${o.i})">ลบ</button></div></div>`).join("")||"ยังไม่มีรายการ";
contractorList.innerHTML=db.contractors.map(c=>`<div class=row><div>${c.name}</div><div>${c.phone}</div></div>`).join("")||"ยังไม่มีผู้รับเหมา";
dueList.innerHTML=db.dues.map(d=>`<div class=row><div>ครบกำหนด</div><div>${d}</div></div>`).join("")||"ยังไม่มีงวด";
let sums={};CATS.forEach(c=>sums[c]=0);db.expenses.forEach(e=>sums[e.cat]+=e.amt);budgetList.innerHTML=CATS.map(c=>`<div class=row><div>${c}</div><div>${sums[c].toLocaleString()}</div></div>`).join("");
if(pieChart)pieChart.destroy();pieChart=new Chart(pie,{type:"pie",data:{labels:CATS,datasets:[{data:CATS.map(c=>sums[c])}]}});
let m=Array(12).fill(0);db.expenses.forEach(e=>m[new Date(e.date).getMonth()]+=e.amt);if(barChart)barChart.destroy();barChart=new Chart(bar,{type:"bar",data:{labels:["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."],datasets:[{data:m}]},options:{plugins:{legend:{display:false}}}});
}
render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script></body></html>
