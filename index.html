
<!doctype html><html lang="th"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Budget Pro X v1.0.1</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head><body>
<header><h2>🏡 Budget Pro X v1.0.1</h2><small>Auto Update พร้อม Safari Fix</small></header>

<main>
<section id="dash" class="page active">
<div class="cards">
<div class="card g"><span>งบรวม</span><b id=t>0</b></div>
<div class="card b"><span>ใช้ไป</span><b id=s>0</b></div>
<div class="card y"><span>คงเหลือ</span><b id=r>0</b></div>
<div class="card p"><span>ความคืบหน้า</span><b id=pc>0%</b></div>
</div>
<div class="panel"><button id="openAdd">➕ เพิ่มรายการ</button></div>
<div class="panel"><canvas id="pie"></canvas></div>
</section>

<section id="budget" class="page"><div class="panel"><h3>Master Budget</h3><div id=budgetList></div><input id=newCat placeholder="เพิ่มหมวดใหม่"><button id=addCat>เพิ่มหมวด</button></div></section>
<section id="exp" class="page"><div class="panel"><input id=q placeholder="ค้นหา"><div id=expenseList></div></div></section>
<section id="con" class="page"><div class="panel"><input id=cn placeholder="ชื่อผู้รับเหมา"><input id=cp placeholder="เบอร์"><button id=saveCon>บันทึก</button><div id=conList></div></div></section>
<section id="pay" class="page"><div class="panel"><input id=due type=date><button id=saveDue>เพิ่มงวด</button><div id=dueList></div></div></section>
<section id="set" class="page"><div class="panel"><input id=budgetInput type=number><button id=saveBudget>บันทึกงบ</button><button id=backup>สำรองข้อมูล</button><button id=restore>กู้คืนข้อมูล</button></div></section>
</main>

<div id=modal class=hide><div class=sheet><h3>เพิ่มรายจ่าย</h3><input id=name placeholder="ชื่อรายการ"><select id=cat></select><input id=amt type=number placeholder="จำนวนเงิน"><button id=saveExpense>บันทึก</button><button id=closeModal>ยกเลิก</button></div></div>

<nav><button data-page=dash>🏠</button><button data-page=budget>💰</button><button data-page=exp>💸</button><button data-page=con>👷</button><button data-page=pay>📄</button><button data-page=set>⚙️</button></nav>

<script src="app.js"></script>
<script src="update.js"></script>
</body></html>
