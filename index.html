<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Budget Pro 8</title><link rel="manifest" href="manifest.json">
<style>
body{margin:0;font-family:Arial;background:#eef2f5}header{background:linear-gradient(135deg,#0f766e,#2563eb);color:#fff;padding:24px;text-align:center}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}.card{padding:16px;border-radius:18px;font-weight:bold}
.c1{background:#d9f99d}.c2{background:#bfdbfe}.c3{background:#fde68a}.c4{background:#f5d0fe}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:10px;border-top:1px solid #ddd}
section{display:none;padding:16px 16px 90px}section.active{display:block}.fab{position:fixed;right:20px;bottom:80px;background:#16a34a;color:#fff;border:none;width:64px;height:64px;border-radius:50%;font-size:34px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}td,th{padding:10px;border-bottom:1px solid #eee}
#modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center}.box{background:#fff;padding:18px;border-radius:18px;width:90%;max-width:420px}
input,select{width:100%;padding:10px;margin:8px 0;border:1px solid #ccc;border-radius:10px}button{cursor:pointer}
</style></head><body>
<header><h1>🏡 Budget Pro 8</h1></header>
<section id=home class=active><div class=cards><div class="card c1">งบรวม<br>5,000,000</div><div class="card c2">ใช้ไป<br><span id=spent>0</span></div><div class="card c3">คงเหลือ<br><span id=left>5,000,000</span></div><div class="card c4">ความคืบหน้า<br><span id=prog>0%</span></div></div></section>
<section id=expenses><h2>รายจ่าย</h2><input id=search placeholder="ค้นหา..." oninput="render()"><table><thead><tr><th>รายการ</th><th>หมวด</th><th>เงิน</th><th></th></tr></thead><tbody id=tb></tbody></table></section>
<section id=contractor><h2>ผู้รับเหมา</h2><p>เวอร์ชันเริ่มต้น</p></section>
<section id=charts><h2>กราฟ</h2><p>กราฟจะเพิ่มในเวอร์ชันถัดไป</p></section>
<section id=settings><h2>ตั้งค่า</h2><button onclick="localStorage.clear();location.reload()">ล้างข้อมูล</button></section>
<button class=fab onclick="modal(1)">+</button>
<div id=modal><div class=box><h3>เพิ่มรายการ</h3><input id=n placeholder=รายการ><input id=a type=number placeholder=จำนวนเงิน><select id=c><option>โครงสร้าง</option><option>เครื่องใช้ไฟฟ้า</option><option>อุปกรณ์ตกแต่ง</option><option>จัดสวน</option><option>อื่นๆ</option></select><button onclick=add()>บันทึก</button><button onclick="modal(0)">ยกเลิก</button></div></div>
<nav><button onclick="show('home')">🏠</button><button onclick="show('expenses')">💸</button><button onclick="modal(1)">➕</button><button onclick="show('charts')">📊</button><button onclick="show('settings')">⚙️</button></nav>
<script>
let data=JSON.parse(localStorage.getItem('bp8')||'[]');
function modal(v){document.getElementById('modal').style.display=v?'flex':'none'}
function show(id){document.querySelectorAll('section').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active')}
function add(){let n=document.getElementById('n').value,a=+document.getElementById('a').value,c=document.getElementById('c').value;if(!n||!a)return alert('กรอกข้อมูล');data.unshift({n,a,c});localStorage.setItem('bp8',JSON.stringify(data));document.getElementById('n').value='';document.getElementById('a').value='';modal(0);render();show('expenses')}
function render(){let q=document.getElementById('search')?.value.toLowerCase()||'';let tb=document.getElementById('tb');tb.innerHTML='';let s=0;data.filter(x=>x.n.toLowerCase().includes(q)).forEach((x,i)=>{s+=x.a;tb.innerHTML+=`<tr><td>${x.n}</td><td>${x.c}</td><td>${x.a.toLocaleString()}</td><td><button onclick="del(${i})">ลบ</button></td></tr>`});document.getElementById('spent').innerText=s.toLocaleString();document.getElementById('left').innerText=(5000000-s).toLocaleString();document.getElementById('prog').innerText=Math.round(s/5000000*100)+'%'}
function del(i){data.splice(i,1);localStorage.setItem('bp8',JSON.stringify(data));render()}
render();
</script></body></html>
