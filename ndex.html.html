<!doctype html><html lang='th'><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Budget Pro</title><style>body{margin:0;font-family:-apple-system;background:#eef1f5}header{background:linear-gradient(135deg,#0f766e,#2563eb);color:#fff;padding:18px 20px 18px 70px;font-size:32px;font-weight:700}#menuBtn{position:fixed;left:12px;top:12px;border:none;background:#fff;border-radius:10px;padding:8px;font-size:22px;z-index:20}#sidebar{position:fixed;left:-260px;top:0;width:250px;height:100%;background:#134e4a;color:#fff;transition:.25s;padding-top:70px;z-index:30}#sidebar.open{left:0}#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25}#overlay.show{display:block}.item{padding:18px;font-size:24px;cursor:pointer}.page{display:none;padding:18px}.card{padding:18px;border-radius:18px;margin:12px 0;font-weight:700}.g{background:#d9f99d}.b{background:#bfdbfe}.y{background:#fef08a}.p{background:#fbcfe8}.fab{position:fixed;right:18px;bottom:18px;width:72px;height:72px;border:none;border-radius:50%;background:#22c55e;color:#fff;font-size:40px;z-index:15}#popup{display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;padding:18px;border-radius:18px;width:88%;max-width:360px;z-index:40}#popup.show{display:block}input{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:10px;box-sizing:border-box}table{width:100%;border-collapse:collapse;background:#fff}th{background:#2563eb;color:#fff}th,td{padding:8px;border-bottom:1px solid #ddd}</style><body><button id=menuBtn>☰</button><div id=overlay></div><div id=sidebar><div class=item data-page=home>🏠 หน้าหลัก</div><div class=item data-page=expense>💸 รายจ่าย</div><div class=item data-page=contractor>👷 ผู้รับเหมา</div><div class=item data-page=install>📄 งวดจ่าย</div><div class=item data-page=chart>📊 กราฟ</div><div class=item data-page=export>📁 Export</div><div class=item data-page=setting>⚙️ ตั้งค่า</div></div><header>🏡 Budget Pro</header><section id=home class=page><h1>โครงการสร้างบ้าน</h1><div class='card g'>งบรวม <span id=budgetCard>5,000,000</span></div><div class='card b'>ใช้ไป <span id=usedCard>0</span></div><div class='card y'>คงเหลือ <span id=remainCard>5,000,000</span></div><div class='card p'>ความคืบหน้า <span id=progressCard>0%</span></div></section><section id=expense class=page><input id=search placeholder='ค้นหา'><table><thead><tr><th>วันที่</th><th>รายการ</th><th>ผู้รับเหมา</th><th>จำนวน</th><th></th></tr></thead><tbody id=tbody></tbody></table></section><section id=contractor class=page><h2>ผู้รับเหมา</h2></section><section id=install class=page><h2>งวดจ่าย</h2></section><section id=chart class=page><h2>กราฟ</h2></section><section id=export class=page><h2>Export</h2></section><section id=setting class=page><h2>ตั้งค่า</h2></section><button id=addBtn class=fab>+</button><div id=popup><h3>เพิ่มรายการ</h3><input id=name placeholder='รายการ'><input id=amt type=number placeholder='จำนวนเงิน'><input id=con placeholder='ผู้รับเหมา'><button id=save>บันทึก</button> <button id=close>ปิด</button></div><script>const B=5000000,s=i=>document.getElementById(i),sidebar=s('sidebar'),overlay=s('overlay');let e=JSON.parse(localStorage.getItem('bp')||'[]');s('menuBtn').onclick=()=>{sidebar.classList.toggle('open');overlay.classList.toggle('show')};overlay.onclick=()=>{sidebar.classList.remove('open');overlay.classList.remove('show');s('popup').classList.remove('show')};function page(id){document.querySelectorAll('.page').forEach(p=>p.style.display='none');s(id).style.display='block';sidebar.classList.remove('open');overlay.classList.remove('show')}document.querySelectorAll('[data-page]').forEach(i=>i.onclick=()=>page(i.dataset.page));s('addBtn').onclick=()=>{s('popup').classList.add('show');overlay.classList.add('show')};s('close').onclick=overlay.onclick;s('save').onclick=()=>{let n=s('name').value.trim(),a=+s('amt').value,c=s('con').value;if(!n||!a)return alert('กรอกข้อมูล');e.unshift({d:new Date().toLocaleDateString('th-TH'),n,a,c});localStorage.setItem('bp',JSON.stringify(e));s('name').value=s('amt').value=s('con').value='';overlay.onclick();render()};function render(){let u=e.reduce((x,y)=>x+y.a,0);s('usedCard').textContent=u.toLocaleString();s('remainCard').textContent=(B-u).toLocaleString();s('progressCard').textContent=Math.round(u/B*100)+'%';tbody.innerHTML='';e.forEach((r,i)=>tbody.innerHTML+=`<tr><td>${r.d}</td><td>${r.n}</td><td>${r.c||'-'}</td><td>${r.a.toLocaleString()}</td><td><button onclick='delExp(${i})'>ลบ</button></td></tr>`)}window.delExp=i=>{e.splice(i,1);localStorage.setItem('bp',JSON.stringify(e));render()};s('search').oninput=()=>document.querySelectorAll('#tbody tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(s('search').value.toLowerCase())?'':'none');render();page('home');</script></body></html>
